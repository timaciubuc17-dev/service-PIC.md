<style>
/* Service Pic MD — Liquid Glass (встроенный CSS) */
:root{--bg:#0a1020;--tx:#e8eef7;--mu:#9fb0c6;--ice:#7dd3fc;--teal:#2dd4bf;--r:22px;--f:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--sp:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{background:var(--bg);color:var(--tx);font:400 17px/1.6 var(--f);overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;transition:opacity .2s,transform .2s}
footer,.nav{transition:opacity .2s,transform .2s}
body.sw :is(main,footer,.nav){opacity:0;transform:translateY(8px)}
a{color:var(--ice)}
:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
.wrap{width:min(1120px,100% - 32px);margin:auto}
section{padding:72px 0}
h1{font-size:clamp(2rem,6vw,3.6rem);line-height:1.08;letter-spacing:-.02em}
h2{font-size:clamp(1.6rem,4vw,2.4rem);line-height:1.15;margin-bottom:12px}
h3{font-size:1.1rem}
.mu{color:var(--mu)}
svg.i{width:1.3em;height:1.3em;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Фон: плавающие сферы */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(1200px 700px at 20% 0,#12213f,var(--bg))}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;animation:drift 26s ease-in-out infinite alternate}
.o1{width:46vmax;height:46vmax;background:#1d4ed8;left:-12vmax;top:-10vmax}
.o2{width:38vmax;height:38vmax;background:var(--teal);right:-14vmax;top:30vh;animation-duration:32s;opacity:.32}
.o3{width:34vmax;height:34vmax;background:var(--ice);left:25vw;bottom:-18vmax;animation-duration:38s;opacity:.28}
@keyframes drift{to{transform:translate3d(8vw,6vh,0) scale(1.15)}}

/* Liquid Glass */
.glass{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.04));-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);border-radius:var(--r);box-shadow:0 24px 50px -24px rgba(0,0,0,.7),inset 1px 1px 0 rgba(255,255,255,.3);transition:transform .35s var(--sp)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.6),rgba(255,255,255,.05) 40%,rgba(255,255,255,.02) 60%,rgba(125,211,252,.35));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(300px circle at var(--mx,50%) var(--my,0),rgba(125,211,252,.2),transparent 60%)}
@media(hover:hover) and (pointer:fine){.glass:hover::after{opacity:1}}

/* Кнопки */
.btn{position:relative;overflow:hidden;display:inline-flex;gap:9px;align-items:center;justify-content:center;min-height:48px;padding:12px 24px;border-radius:99px;border:1px solid rgba(255,255,255,.25);background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.05));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 22px rgba(0,0,0,.3);color:var(--tx);font-family:inherit;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;transition:transform .4s var(--sp),box-shadow .3s}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.4),transparent);transform:translateX(-160%) skewX(-18deg)}
.btn:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 14px 30px rgba(0,0,0,.4)}
.btn:hover::after{transform:translateX(420%) skewX(-18deg);transition:transform .8s}
.btn:active{transform:scale(.96)}
.btn.p{color:#04202b;border-color:rgba(255,255,255,.5);background:linear-gradient(160deg,#bae6fd,#5eead4)}
.btn.wa{background:linear-gradient(160deg,rgba(37,211,102,.55),rgba(18,140,70,.55))}

/* Шапка */
.hd{position:sticky;top:0;z-index:50;border-radius:0;border-bottom:1px solid rgba(255,255,255,.12)}
.hd::before,.hd::after{display:none}
.hb{display:flex;align-items:center;gap:14px;min-height:68px}
.logo{display:flex;align-items:center;gap:10px;color:var(--tx);text-decoration:none;font-weight:800}
.logo img{width:44px;height:44px;border-radius:12px;object-fit:cover}
.nav{display:flex;gap:20px;margin-left:auto}
.nav a{color:var(--mu);text-decoration:none;font-size:15px}
.nav a:hover{color:var(--tx)}
.burger{display:none;width:48px;height:48px;padding:0}

/* Ползунок языка */
.lang{--i:0;position:relative;display:inline-grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.lang i{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:99px;background:linear-gradient(160deg,#bae6fd,#5eead4);box-shadow:0 4px 14px rgba(45,212,191,.45);transform:translateX(calc(var(--i)*100%));transition:transform .5s var(--sp)}
.lang button{position:relative;z-index:1;min-width:46px;min-height:36px;background:none;border:0;border-radius:99px;color:var(--mu);font-family:inherit;font-weight:800;font-size:13px;cursor:pointer;transition:color .3s}
.lang button[aria-pressed=true]{color:#04202b}

/* Hero */
.hero{padding:64px 0 40px}
.hg{display:grid;grid-template-columns:1.3fr .7fr;gap:32px;align-items:center}
.hero p{color:var(--mu);margin:18px 0 28px;max-width:56ch}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.hc{padding:28px;text-align:center}
.hc img{width:min(220px,100%);border-radius:24px;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.hc p{margin:14px 0 0;font-size:14px}

/* Каталог и преимущества */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px;margin-top:28px}
.card{padding:16px;display:flex;flex-direction:column;gap:8px}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;background:#13203a}
.badge{position:absolute;top:26px;left:26px;z-index:2;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:800;color:#04202b;background:linear-gradient(160deg,#bbf7d0,#5eead4)}
.sp{color:var(--mu);font-size:14px}
.pr{font-size:1.35rem;font-weight:800;margin:4px 0 8px}
.card .btn{margin-top:auto}
.adv4{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:28px}
.adv{padding:24px}
.adv svg{width:34px;height:34px;color:var(--ice);margin-bottom:10px}
.adv p{color:var(--mu);font-size:15px;margin-top:6px}

/* Квиз */
.quiz{padding:28px;margin-top:24px;max-width:760px}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;width:25%;background:linear-gradient(90deg,var(--ice),var(--teal));transition:width .5s var(--sp)}
.qh{display:flex;justify-content:space-between;margin:14px 0 6px;color:var(--mu);font-size:14px}
.step{animation:in .4s}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.step h3{font-size:1.3rem;margin:8px 0 16px}
.opts{display:grid;gap:10px}
.opt{justify-content:flex-start;text-align:left;width:100%}
.opt.on{border-color:var(--ice);box-shadow:0 0 0 3px rgba(125,211,252,.25),inset 0 1px 0 rgba(255,255,255,.4)}
form.step{display:grid;gap:12px}
input[type=text],input[type=tel]{width:100%;min-height:50px;padding:12px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);color:var(--tx);font:inherit}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--mu)}
.ck input{margin-top:5px;width:18px;height:18px;accent-color:#5eead4}

/* Контакты */
.cg{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}
.ci{padding:28px;display:grid;gap:14px;align-content:start}
.ci b{display:block;color:var(--mu);font-size:13px;font-weight:600}
.map{min-height:300px;display:grid;place-items:center;text-align:center;padding:24px;overflow:hidden;gap:12px}
.map.on{display:block;padding:0}
.map iframe{width:100%;height:100%;min-height:300px;border:0;display:block}

/* Внутренние экраны */
.c{text-align:center;display:grid;justify-items:center;gap:16px;padding:48px 28px;max-width:640px;margin:48px auto}
.big{font-size:clamp(4rem,16vw,7rem);font-weight:800;line-height:1;background:linear-gradient(135deg,var(--ice),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.ok{width:84px;height:84px}
.ok circle,.ok path{stroke:#5eead4;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:80;animation:dr 1s ease both}
@keyframes dr{from{stroke-dashoffset:80}}
.pv{padding:32px;margin:40px auto;max-width:820px}
.pv h2{font-size:1.2rem;margin:22px 0 6px}
.pv p{color:#c8d4e4}

footer{padding:36px 0;border-top:1px solid rgba(255,255,255,.12);color:var(--mu);font-size:14px}
.fg{display:flex;gap:20px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.fab{position:fixed;right:16px;bottom:16px;z-index:60;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,rgba(37,211,102,.85),rgba(18,140,70,.85));box-shadow:0 10px 28px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .4s var(--sp)}
.fab:hover{transform:scale(1.1)}
.fab svg{width:30px;height:30px}

@media(max-width:860px){
  .hg,.cg{grid-template-columns:1fr}.hc{display:none}section{padding:52px 0}
  .burger{display:inline-flex}
  .nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:6px;padding:14px 16px;background:rgba(10,16,32,.95);margin:0}
  .nav.open{display:flex}.nav a{padding:12px 4px;font-size:17px}
  .hb .lang{margin-left:auto}.hcall span{display:none}
}
@media(max-width:700px){.glass,.btn,.hd{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}.orb{filter:blur(50px)}}
@media(hover:none),(prefers-reduced-motion:reduce){.btn:hover{transform:none}.btn:hover::after{transition:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>

/* === ЛОГИКА === */
const $=(s,c=document)=>c.querySelector(s),$$=(s,c=document)=>[...c.querySelectorAll(s)];
let cur="ro", view="index";
try{const s=localStorage.getItem("pic_lang");if(s=="ro"||s=="ru")cur=s}catch(e){}
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ");
function lead(){try{return JSON.parse(sessionStorage.getItem("pic_lead"))}catch(e){return null}}
function leadMsg(){const d=lead(),t=T[cur];if(!d)return t.wa_gen;return t.wa_lead.replace("{b}",t["q1o"+d.a[0]]).replace("{l}",t["q2o"+d.a[1]]).replace("{d}",t["q3o"+d.a[2]]).replace("{n}",d.n).replace("{p}",d.p)}

function links(){
  const t=T[cur],enc=encodeURIComponent;
  $$("[data-wa]").forEach(a=>{
    const k=a.dataset.wa,m=k=="lead"?leadMsg():k=="gen"?t.wa_gen:t.wa_model.replace("{m}",k);
    a.href="https://wa.me/"+CFG.wa+"?text="+enc(m);
  });
  $$("[data-tel]").forEach(a=>a.href="tel:"+CFG.tel);
  $$("[data-viber]").forEach(a=>a.href="viber://chat?number="+enc(CFG.tel));
  $$("[data-gmaps]").forEach(a=>a.href="https://www.google.com/maps/search/?api=1&query="+enc(CFG.addr));
  $$("[data-waze]").forEach(a=>a.href="https://waze.com/ul?q="+enc(CFG.addr)+"&navigate=yes");
  $$("[data-addr]").forEach(e=>e.textContent=CFG.addr);
  $$("[data-phone]").forEach(e=>e.textContent=CFG.telShow);
}

function grid(){
  const g=$("#grid");if(!g)return;const t=T[cur];
  g.innerHTML=MODELS.map(m=>`<article class="card glass tilt"><span class="badge">${t.instock}</span><img src="${m.img}" alt="${m.name}" width="600" height="450" loading="lazy"><h3>${m.name}</h3><p class="sp">${m.spec}</p><div class="pr">${m.price?fmt(m.price)+" MDL":t.price_req}</div><a class="btn wa" data-wa="${m.name}" target="_blank" rel="noopener">${t.ask}</a></article>`).join("");
}

function privacy(){
  const p=$("#pv");if(p)p.innerHTML=T[cur].pv.map(s=>`<h2>${s[0]}</h2><p>${s[1]}</p>`).join("");
}

function apply(){
  const t=T[cur];
  document.documentElement.lang=cur;
  document.body.dataset.page=view;
  $$("[data-i18n]").forEach(e=>e.innerHTML=t[e.dataset.i18n]);
  $$("[data-ph]").forEach(e=>e.placeholder=t[e.dataset.ph]);
  document.title=t["t_"+view]||t.t_index;
  $$(".lang").forEach(s=>s.style.setProperty("--i",cur=="ru"?1:0));
  $$(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l==cur));
  grid();privacy();links();
}

function setLang(l){
  if(l==cur)return;
  try{localStorage.setItem("pic_lang",l)}catch(e){}
  document.body.classList.add("sw");
  setTimeout(()=>{cur=l;apply();document.body.classList.remove("sw")},200);
  $$(".lang").forEach(s=>s.style.setProperty("--i",l=="ru"?1:0));
  $$(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l==l));
}

function setView(v){
  if(!["index","404","thanks","privacy"].includes(v))v="index";
  view=v;
  ["index","404","thanks","privacy"].forEach(id=>{
    const el=$("#view-"+id);
    if(el)el.hidden=(id!==v);
  });
  apply();
  window.scrollTo({top:0,behavior:"smooth"});
}

$$(".lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
document.addEventListener("click",e=>{
  const btn=e.target.closest("[data-view]");
  if(!btn)return;
  e.preventDefault();
  setView(btn.dataset.view);
});

/* Мобильное меню */
const bg=$("#burger"),nav=$("#nav");
if(bg){
  bg.onclick=()=>{const o=nav.classList.toggle("open");bg.setAttribute("aria-expanded",o)};
  $$("#nav a").forEach(a=>a.onclick=()=>{nav.classList.remove("open");setView("index")});
}

/* Подсветка и наклон за курсором */
if(matchMedia("(hover:hover) and (pointer:fine)").matches){
  const rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
  document.addEventListener("pointermove",e=>{
    const g=e.target.closest&&e.target.closest(".glass");if(!g)return;
    const r=g.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    g.style.setProperty("--mx",x+"px");g.style.setProperty("--my",y+"px");
    if(!rm&&g.classList.contains("tilt"))g.style.transform=`perspective(800px) rotateX(${(.5-y/r.height)*6}deg) rotateY(${(x/r.width-.5)*6}deg) translateY(-3px)`;
  });
  document.addEventListener("pointerout",e=>{
    const g=e.target.closest&&e.target.closest(".tilt");
    if(g&&!g.contains(e.relatedTarget))g.style.transform="";
  });
}

/* Квиз */
const qs=$("#qsteps");
if(qs){
  let qi=0,ans=[];const QZ=[["q1",3],["q2",3],["q3",2]];
  qs.innerHTML=QZ.map(([k,n],i)=>`<div class="step" data-q="${i}"><h3 data-i18n="${k}"></h3><div class="opts">${Array.from({length:n},(_,j)=>`<button type="button" class="btn opt" data-j="${j}" data-i18n="${k}o${j}"></button>`).join("")}</div></div>`).join("");
  const show=i=>{
    qi=i;
    $$("#quiz .step").forEach((s,j)=>s.hidden=j!=i);
    $("#lead").hidden=(i!==QZ.length);
    $("#bar").style.width=((i+1)/4)*100+"%";
    $("#stepn").textContent=Math.min(i+1,4)+" / 4";
    $("#back").hidden=i==0;
  };
  qs.onclick=e=>{
    const b=e.target.closest(".opt");if(!b)return;
    ans[qi]=+b.dataset.j;
    $$(".opt",b.parentNode).forEach(x=>x.classList.toggle("on",x==b));
    setTimeout(()=>show(qi+1),240);
  };
  $("#back").onclick=()=>show(Math.max(0,qi-1));
  $("#lead").onsubmit=e=>{
    e.preventDefault();
    const f=e.target,d={a:ans,n:f.n.value.trim(),p:f.p.value.trim(),lang:cur};
    try{sessionStorage.setItem("pic_lead",JSON.stringify(d))}catch(x){}
    const finish=()=>{apply();setView("thanks")};
    if(CFG.form){
      const t=T[cur];
      fetch(CFG.form,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({buget:t["q1o"+d.a[0]],incarcare:t["q2o"+d.a[1]],livrare:t["q3o"+d.a[2]],nume:d.n,telefon:d.p,limba:cur})}).then(finish).catch(finish);
    }else finish();
  };
  show(0);
}

/* Карта по клику */
const ml=$("#mload");
if(ml)ml.onclick=()=>{
  const m=$("#map"),f=document.createElement("iframe");
  f.src=CFG.map||"https://www.google.com/maps?q="+encodeURIComponent(CFG.addr)+"&output=embed";
  f.title="Service Pic MD — Google Maps";f.loading="lazy";f.referrerPolicy="no-referrer-when-downgrade";f.allowFullscreen=true;
  m.classList.add("on");m.replaceChildren(f);
};

apply();
